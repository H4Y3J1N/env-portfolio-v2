# Langfuse Configuration

enabled: true

connection:
  public_key: "${LANGFUSE_PUBLIC_KEY}"
  secret_key: "${LANGFUSE_SECRET_KEY}"
  host: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"

tracing:
  # Trace all LLM calls
  trace_llm: true

  # Trace RAG retrieval
  trace_retrieval: true

  # Trace tool calls
  trace_tools: true

metrics:
  # Track token usage
  track_tokens: true

  # Track latency
  track_latency: true

  # Track costs (if available)
  track_costs: true

sampling:
  # Sample rate (1.0 = 100%)
  rate: 1.0
