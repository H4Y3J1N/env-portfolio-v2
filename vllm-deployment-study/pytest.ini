[pytest]
# vLLM Deployment Study 테스트 설정

# 테스트 디렉토리
testpaths = tests

# Python 파일 패턴
python_files = test_*.py

# 테스트 클래스 패턴
python_classes = Test*

# 테스트 함수 패턴
python_functions = test_*

# asyncio 모드
asyncio_mode = auto

# 출력 설정
addopts = -v --tb=short

# 로깅 설정
log_cli = true
log_cli_level = INFO

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
