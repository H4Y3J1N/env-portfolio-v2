# 실험 1: Baseline
# 목표: 기본 설정으로 학습 가능성 확인

experiment:
  name: "exp-001"
  description: "Baseline experiment with default settings"

model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  trust_remote_code: true

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

optimizer:
  optim: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"

data:
  train_file: "data/processed/train.json"
  val_file: "data/processed/val.json"
  max_seq_length: 2048
  dataset_text_field: "text"

misc:
  fp16: false
  bf16: true
  max_grad_norm: 0.3
  seed: 42
  output_dir: "results/exp-001"
  report_to: "none"  # "wandb" for logging
