# ===========================================
# Fixed-size Chunking Configuration
# ===========================================

chunking:
  strategy: "fixed"
  chunk_size: 500        # 단어 수
  chunk_overlap: 50      # 겹치는 단어 수
  unit: "words"          # words, tokens, characters

embedding:
  model_name: "BAAI/bge-m3"
  batch_size: 32
  normalize: true
  device: "auto"         # auto, cpu, cuda

retrieval:
  top_k: 5
  similarity_metric: "cosine"  # cosine, euclidean, dot_product

evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "mrr"
  k_values: [1, 3, 5, 10]
