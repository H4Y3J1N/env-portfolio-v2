# ===========================================
# Recursive Chunking Configuration
# ===========================================

chunking:
  strategy: "recursive"
  chunk_size: 500        # 최대 단어 수
  chunk_overlap: 50      # 겹치는 단어 수
  separators:
    - "\n\n\n"           # 섹션 구분
    - "\n\n"             # 문단 구분
    - "\n"               # 줄 바꿈
    - ". "               # 문장 끝
    - "? "               # 질문 끝
    - "! "               # 감탄 끝
    - " "                # 단어
  keep_separator: true   # 구분자 유지 여부

embedding:
  model_name: "BAAI/bge-m3"
  batch_size: 32
  normalize: true
  device: "auto"

retrieval:
  top_k: 5
  similarity_metric: "cosine"

evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "mrr"
  k_values: [1, 3, 5, 10]
